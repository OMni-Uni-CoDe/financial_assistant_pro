{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Forecast Center</h1>

    <div class="card">

        <h3>Monthly Forecast</h3>

        <div id="forecastContainer">

            Loading forecast...

        </div>

    </div>

</div>

<script>

    async function loadForecast() {

        try {

            const response =
                await fetch(
                    "/get_forecast"
                );

            const data =
                await response.json();

            document
                .getElementById(
                    "forecastContainer"
                )
                .innerHTML =
                `<pre>${data.forecast}</pre>`;

        }

        catch (error) {

            console.error(
                "Forecast failed:",
                error
            );

        }

    }

    loadForecast();

</script>

{% endblock %}

{% block scripts %}
<script src="{{ url_for(
    'static',
    filename='dashboard.js'
) }}"></script>
{% endblock %}
