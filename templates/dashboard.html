{% extends "base.html" %}
{% block content %}

<div class="layout">

    
    <aside class="sidebar">

        <div class="sidebar-header">
            <h2>Finance Pro</h2>
        </div>

        <nav class="sidebar-nav">
            <a href="#dashboard-section">📊 Dashboard</a>
            <a href="#reports-section">📁 Reports</a>
            <a href="#ai-section">🤖 AI Assistant</a>
            <a href="#activity-section">📜 Activity</a>
            <a href="/logout">🚪 Logout</a>
        </nav>

    </aside>

    <main class="main-content">

        <h2>Welcome, {{ username }}</h2>

        <section id="dashboard-section">

            <div class="stats-grid">

                <div class="stat-card">
                    <h4>Total Spending</h4>
                    <p id="totalSpent">₹0</p>
                </div>

                <div class="stat-card">
                    <h4>Categories</h4>
                    <p id="totalCategories">0</p>
                </div>

                <div class="stat-card">
                    <h4>Top Category</h4>
                    <p id="topCategory">-</p>
                </div>

                <div class="stat-card">
                    <h4>Average Spend</h4>
                    <p id="averageSpend">₹0</p>
                </div>

            </div>

            <div class="top-row">

                <div class="left">

                    <h3>Add Expense</h3>

                    <form id="expenseForm">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="text" name="category" placeholder="Category" required>
                        <input type="number" step="0.01" name="amount" placeholder="Amount" required>
                        <button type="submit">Add</button>
                    </form>

                    <p id="expenseMsg"></p>

                </div>

                <div class="right">

                    <div class="charts">
                        <canvas id="categoryChart"></canvas>
                        <canvas id="trendChart"></canvas>
                    </div>

                </div>

            </div>

        </section>

        <section id="reports-section" class="section-card">

            <h3>Reports</h3>

            <div class="actions">
                <button id="csvBtn">CSV Report</button>
                <button id="pdfBtn">PDF Report</button>
                <button id="predictBtn">Predict Future</button>
            </div>

            <p id="prediction"></p>

        </section>

        <section id="ai-section" class="section-card">

            <h3>AI Assistant</h3>

            <form id="askForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="text"
                       name="question"
                       placeholder="Ask about your spending..."
                       required>
                <button type="submit">Ask</button>
            </form>

            <div id="response"></div>

        </section>

        <section id="activity-section" class="section-card">

            <h3>Recent Activity</h3>

            <div id="history"></div>

        </section>

    </main>


</div>

{% endblock %}
