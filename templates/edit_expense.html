{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Edit Expense</h1>

    <div class="card">

        <form method="POST">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <input type="number"
                   step="0.01"
                   name="amount"
                   value="{{ expense.amount }}"
                   required>

            <input type="text"
                   name="category"
                   value="{{ expense.category }}"
                   required>

            <input type="text"
                   name="subcategory"
                   value="{{ expense.subcategory }}">

            <input type="date"
                   name="date"
                   value="{{ expense.date }}">

            <button type="submit">
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
