{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Expense Management</h1>

    <div class="card">

        <h3>Add Expense</h3>

        <form method="POST" action="/add_expense">

            <input type="number"
                   step="0.01"
                   name="amount"
                   placeholder="Amount"
                   required>

            <input type="text"
                   name="category"
                   placeholder="Category"
                   required>

            <input type="text"
                   name="subcategory"
                   placeholder="Subcategory">

            <button type="submit">
                Add Expense
            </button>

        </form>

    </div>

    <br>

    <div class="card">

        <h3>Expense History</h3>

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Subcategory</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                {% for expense in expenses %}

                <tr>

                    <td>{{ expense.date }}</td>
                    <td>{{ expense.category }}</td>
                    <td>{{ expense.subcategory }}</td>
                    <td>₹{{ expense.amount }}</td>

                    <td>

                        <form method="POST"
                              action="/delete_expense/{{ expense.id }}">

                            <button type="submit">
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
