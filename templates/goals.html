{% extends "base.html" %}

{% block content %}

<!-- Savings Goal -->

<div class="section-card">

    <h3>Savings Goal</h3>

    <form id="goalForm"
          method="POST"
          action="/save_goal">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <input type="text"
               id="goalName"
               name="goal_name"
               placeholder="Goal Name"
               required>

        <input type="number"
               id="goalTarget"
               name="target_amount"
               min="1"
               required
               placeholder="Target Amount">

        <input type="number"
               id="goalCurrent"
               name="current_amount"
               min="0"
               step="0.01"
               required
               placeholder="Current Savings">

        <button type="submit">
            Save Goal
        </button>

    </form>

    <div id="goalInfo">

        <p>
            Goal:
            <strong id="goalDisplayName">
                -
            </strong>
        </p>

        <p>
            Saved:
            ₹<span id="goalCurrentDisplay">0</span>
            /
            ₹<span id="goalTargetDisplay">0</span>
        </p>

        <p>
            Progress:
            <span id="goalPercentage">
                0%
            </span>
        </p>

        <p id="goalMilestone"
           class="goal-milestone">
        </p>

        <p id="goalEta"
           class="goal-eta">
        </p>

        <div class="budget-bar">

            <div id="goalProgressBar"
                 class="budget-fill"
                 style="width:0%"></div>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for(
    'static',
    filename='dashboard.js'
) }}"></script>
{% endblock %}
