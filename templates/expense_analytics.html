{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Expense Analytics</h1>

    <div class="stats-grid">

        <div class="stat-card">

            <h4>Monthly Spending</h4>

            <h2>
                ₹{{ monthly_spending }}
            </h2>

        </div>

        <div class="stat-card">
            <h4>Top Category</h4>
            <h2 id="topCategory">Loading...</h2>
        </div>

        <div class="stat-card">
            <h4>Top Subcategory</h4>
            <h2 id="topSubcategory">Loading...</h2>
        </div>

        <div class="stat-card">
            <h4>Monthly Change</h4>
            <h2 id="monthlyChange">
                Loading...
            </h2>
        </div>

    </div>

    <div class="card">

        <h3>Category Breakdown Chart</h3>

        <div style="max-width:900px;height:500px;margin:auto;">
            <canvas id="categoryChart"></canvas>
        </div>

    </div>

    <br>

    <div class="card">

        <h3>Financial Insights</h3>

        <div id="insightsContainer">

            Loading insights...

        </div>

    </div>
    
</div>

<script>

    async function loadTopSubcategory() {

        try {

            const response =
                await fetch(
                    "/get_top_subcategory"
                );

            const data =
                await response.json();

            document
                .getElementById(
                    "topCategory"
                )
                .innerText =
                data.category;

            document
                .getElementById(
                    "topSubcategory"
                )
                .innerText =
                data.subcategory;

        }

        catch (error) {

            console.error(error);

        }

    }
        async function loadMonthlyComparison() {

            try {

                const response =
                    await fetch(
                        "/get_monthly_comparison"
                    );

                const data =
                    await response.json();

                document
                    .getElementById(
                        "monthlyChange"
                    )
                const card =
                    document.getElementById(
                        "monthlyChange"
                    );

                if (
                    data.percentage_change === undefined
                ) {
                    card.innerText =
                        data.comparison || "No data";

                    card.style.color =
                        "#ffffff";

                    return;
                }


                if (
                    data.percentage_change >= 0
                ) {

                    card.innerText =
                        "↑ " +
                        data.percentage_change +
                        "%";

                    card.style.color =
                        "#4CAF50";

                }
                else {

                    card.innerText =
                        "↓ " +
                        Math.abs(
                            data.percentage_change
                        ) +
                        "%";

                    card.style.color =
                        "#FF5252";

                }

            }

            catch (error) {

                console.error(
                    "Monthly comparison failed:",
                    error
                );

            }

        }

        async function loadInsights() {

            try {

                const response =
                    await fetch(
                        "/get_insights"
                    );

                const data =
                    await response.json();

                const container =
                    document.getElementById(
                        "insightsContainer"
                    );

                container.innerHTML = "";

                if (
                    !data.insights ||
                    data.insights.length === 0
                ) {

                    container.innerHTML =
                        "<p>No insights available.</p>";

                    return;

                }

                data.insights.forEach(
                    insight => {

                        const div =
                            document.createElement(
                                "div"
                            );

                        div.className =
                            "insight-item";

                        div.innerHTML = `

                        <strong>
                            ${insight.title}
                        </strong>

                        <br>

                        ${insight.message}

                    `;

                        container.appendChild(
                            div
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    "Insights failed:",
                    error
                );

            }

        }

    loadTopSubcategory();
    loadMonthlyComparison();
    loadInsights();

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

    async function loadCharts() {

        try {

            const response =
                await fetch("/get_data");

            const data =
                await response.json();

            // =====================
            // Category Pie Chart
            // =====================

            const categoryCtx =
                document
                    .getElementById("categoryChart")
                    .getContext("2d");

            new Chart(categoryCtx, {

                type: "doughnut",

                data: {

                    labels: data.categories,

                    datasets: [{

                        data: data.totals,

                        backgroundColor: [
                            "#36A2EB",
                            "#FF6384",
                            "#FF9F40",
                            "#FFCD56",
                            "#4BC0C0",
                            "#9966FF",
                            "#C9CBCF"
                        ],

                        borderWidth: 2

                    }]
                },

                options: {

                    responsive: true,
                    maintainAspectRatio: false,

                    plugins: {

                        legend: {

                            position: "bottom"
                        },

                        title: {

                            display: true,
                            text: "Expense Distribution",
                            font: {
                                size: 18
                            }
                        }

                    }

                }

            });

            // =====================
            // Monthly Trend
            // =====================

            const trendCtx =
                document
                    .getElementById("trendChart")
                    .getContext("2d");

            new Chart(trendCtx, {

                type: "line",

                data: {

                    labels:
                        data.dates,

                    datasets: [{
                        label: "Spending",
                        data: data.daily_totals,
                        fill: false,
                        tension: 0,
                        borderWidth: 3,
                        pointRadius: 5
                    }]

                }

            });

        }

        catch (error) {

            console.error(
                "Chart loading failed:",
                error
            );

        }

    }

    async function loadSubcategoryChart() {

        try {

            const response =
                await fetch(
                    "/get_subcategory_data"
                );

            const data =
                await response.json();

            const ctx =
                document
                    .getElementById(
                        "subcategoryChart"
                    )
                    .getContext(
                        "2d"
                    );

            new Chart(ctx, {

                type: "bar",

                data: {

                    labels:
                        data.labels,

                    datasets: [{

                        label:
                            "Amount Spent",

                        data:
                            data.values

                    }]

                },

                options: {

                    indexAxis: "y",

                    responsive: true,

                    maintainAspectRatio: false

                }

            });

        }

        catch (error) {

            console.error(error);

        }

    }

    loadCharts();

    loadSubcategoryChart();

</script>

{% endblock %}
