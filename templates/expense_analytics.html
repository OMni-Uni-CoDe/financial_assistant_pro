{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Expense Analytics</h1>

    <div class="stats-grid">

        <div class="stat-card">
            <h4>Monthly Spending</h4>
            <h2>Loading...</h2>
        </div>

        <div class="stat-card">
            <h4>Top Category</h4>
            <h2 id="topCategory">Loading...</h2>
        </div>

        <div class="stat-card">
            <h4>Top Subcategory</h4>
            <h2 id="topSubcategory">Loading...</h2>
        </div>

    </div>

    <div class="card">

        <h3>Category Breakdown Chart</h3>

        <div style="height:300px;">
            Chart Coming Soon
        </div>

    </div>

    <br>

    <div class="card">

        <h3>Monthly Trend</h3>

        <div style="height:300px;">
            Chart Coming Soon
        </div>

    </div>

    <br>

    <div class="card">

        <h3>Subcategory Breakdown</h3>

        <div>
            Data Coming Soon
        </div>

    </div>

</div>

<script>

async function loadTopSubcategory() {

    try {

        const response =
            await fetch(
                "/get_top_subcategory"
            );

        const data =
            await response.json();

        document
            .getElementById(
                "topCategory"
            )
            .innerText =
            data.category;

        document
            .getElementById(
                "topSubcategory"
            )
            .innerText =
            data.subcategory;

    }

    catch (error) {

        console.error(error);

    }

}

loadTopSubcategory();

</script>

{% endblock %}
