{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Expense Analytics</h1>

    <div class="stats-grid">

        <div class="stat-card">

            <h4>Monthly Spending</h4>

            <h2>
                ₹{{ monthly_spending }}
            </h2>

        </div>

        <div class="stat-card">
            <h4>Top Category</h4>
            <h2 id="topCategory">Loading...</h2>
        </div>

        <div class="stat-card">
            <h4>Top Subcategory</h4>
            <h2 id="topSubcategory">Loading...</h2>
        </div>

    </div>

    <div class="card">

        <h3>Category Breakdown Chart</h3>

        <canvas id="categoryChart"></canvas>

    </div>

    <br>

    <div class="card">

        <h3>Monthly Trend</h3>

        <canvas id="trendChart"></canvas>

    </div>

    <br>

    <div class="card">

        <h3>Subcategory Breakdown</h3>

        <div>
            Data Coming Soon
        </div>

    </div>

</div>

<script>

async function loadTopSubcategory() {

    try {

        const response =
            await fetch(
                "/get_top_subcategory"
            );

        const data =
            await response.json();

        document
            .getElementById(
                "topCategory"
            )
            .innerText =
            data.category;

        document
            .getElementById(
                "topSubcategory"
            )
            .innerText =
            data.subcategory;

    }

    catch (error) {

        console.error(error);

    }

}

loadTopSubcategory();

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

    async function loadCharts() {

        try {

            const response =
                await fetch("/get_data");

            const data =
                await response.json();

            // =====================
            // Category Pie Chart
            // =====================

            const categoryCtx =
                document
                    .getElementById("categoryChart")
                    .getContext("2d");

            new Chart(categoryCtx, {

                type: "doughnut",

                data: {

                    labels: data.categories,

                    datasets: [{

                        data: data.totals,

                        borderWidth: 2

                    }]
                },

                options: {

                    responsive: true,

                    maintainAspectRatio: true,

                    plugins: {

                        legend: {

                            position: "bottom"

                        }

                    }

                }

            });

            // =====================
            // Monthly Trend
            // =====================

            const trendCtx =
                document
                    .getElementById("trendChart")
                    .getContext("2d");

            new Chart(trendCtx, {

                type: "line",

                data: {

                    labels:
                        data.dates,

                    datasets: [{

                        label:
                            "Spending",

                        data:
                            data.daily_totals

                    }]

                }

            });

        }

        catch (error) {

            console.error(
                "Chart loading failed:",
                error
            );

        }

    }

    loadCharts();

</script>

{% endblock %}
