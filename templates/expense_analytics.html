{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Expense Analytics</h1>

    <div class="stats-grid">

        <div class="stat-card">

            <h4>Monthly Spending</h4>

            <h2>
                ₹{{ monthly_spending }}
            </h2>

        </div>

        <div class="stat-card">
            <h4>Top Category</h4>
            <h2 id="topCategory">Loading...</h2>
        </div>

        <div class="stat-card">
            <h4>Top Subcategory</h4>
            <h2 id="topSubcategory">Loading...</h2>
        </div>

    </div>

    <div class="card">

        <h3>Category Breakdown Chart</h3>

        <div style="max-width:900px;height:500px;margin:auto;">
            <canvas id="categoryChart"></canvas>
        </div>

    </div>

    <br>

    <div class="card">

        <h3>Monthly Trend</h3>

        <canvas id="trendChart"></canvas>

    </div>

    <br>

    <div class="card">

        <h3>Subcategory Breakdown</h3>

        <div style="height:500px;">
            <canvas id="subcategoryChart"></canvas>
        </div>

    </div>

</div>

<script>

async function loadTopSubcategory() {

    try {

        const response =
            await fetch(
                "/get_top_subcategory"
            );

        const data =
            await response.json();

        document
            .getElementById(
                "topCategory"
            )
            .innerText =
            data.category;

        document
            .getElementById(
                "topSubcategory"
            )
            .innerText =
            data.subcategory;

    }

    catch (error) {

        console.error(error);

    }

}

loadTopSubcategory();

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

    async function loadCharts() {

        try {

            const response =
                await fetch("/get_data");

            const data =
                await response.json();

            // =====================
            // Category Pie Chart
            // =====================

            const categoryCtx =
                document
                    .getElementById("categoryChart")
                    .getContext("2d");

            new Chart(categoryCtx, {

                type: "doughnut",

                data: {

                    labels: data.categories,

                    datasets: [{

                        data: data.totals,

                        borderWidth: 2

                    }]
                },

                options: {

                    responsive: true,
                    maintainAspectRatio: false,

                    plugins: {

                        legend: {

                            position: "bottom"
                        },

                        title: {

                            display: true,

                            text: "Expense Distribution"
                        }

                    }

                }

            });

            // =====================
            // Monthly Trend
            // =====================

            const trendCtx =
                document
                    .getElementById("trendChart")
                    .getContext("2d");

            new Chart(trendCtx, {

                type: "line",

                data: {

                    labels:
                        data.dates,

                    datasets: [{
                        label: "Spending",
                        data: data.totals,
                        fill: false,
                        tension: 0.3,
                        borderWidth: 3,
                        borderWidth: 3,
                        pointRadius: 5
                    }]

                }

            });

        }

        catch (error) {

            console.error(
                "Chart loading failed:",
                error
            );

        }

    }

    async function loadSubcategoryChart() {

        try {

            const response =
                await fetch(
                    "/get_subcategory_data"
                );

            const data =
                await response.json();

            const ctx =
                document
                    .getElementById(
                        "subcategoryChart"
                    )
                    .getContext(
                        "2d"
                    );

            new Chart(ctx, {

                type: "bar",

                data: {

                    labels:
                        data.labels,

                    datasets: [{

                        label:
                            "Amount Spent",

                        data:
                            data.values

                    }]

                },

                options: {

                    indexAxis: "y",

                    responsive: true,

                    maintainAspectRatio: false

                }

            });

        }

        catch (error) {

            console.error(error);

        }

    }

    loadCharts();

    loadSubcategoryChart();

</script>

{% endblock %}
