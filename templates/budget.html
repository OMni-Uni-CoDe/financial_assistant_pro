{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Budget Center</h1>

    <div class="section-card">

        <h3>Monthly Budget</h3>

        <form id="budgetForm"
              method="POST"
              action="/budget">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <input type="number"
                   id="budgetInput"
                   name="budget"
                   placeholder="Enter Monthly Budget"
                   min="0"
                   step="0.01">

            <button type="submit">
                Save Budget
            </button>

        </form>

        <div style="margin-top:20px;">

            <p>
                Budget:
                <strong id="budgetAmount">₹0</strong>
            </p>

            <p>
                Remaining:
                <strong id="remainingBudget">₹0</strong>
            </p>

            <p>
                Usage:
                <strong id="budgetPercentage">0%</strong>
            </p>

            <div class="budget-bar">

                <div class="budget-fill"
                     id="budgetFill">
                </div>

            </div>

            <p id="budgetAlert"></p>

        </div>

    </div>

</div>

{% endblock %}
