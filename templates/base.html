<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width,initial-scale=1" />

    <meta name="csrf-token"
          content="{{ csrf_token() }}">

    <title>
        {{ title if title else 'Financial Assistant' }}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='ai.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="layout">

        <button class="menu-toggle"
                id="menuToggle">
            ☰
        </button>

        <div class="sidebar-overlay"
             id="sidebarOverlay">
        </div>

        <aside class="sidebar">

            <div class="sidebar-header">

                <h2>
                    Finance Pro
                </h2>

            </div>

            <nav class="sidebar-nav">

                <a href="/dashboard">
                    📊 Dashboard
                </a>

                <a href="/expenses">
                    💳 Expenses
                </a>

                <a href="/expense_analytics">
                    📈 Analytics
                </a>

                <a href="/goals">
                    🎯 Goals
                </a>

                <a href="/reports">
                    📁 Reports
                </a>

                <a href="/assistant">
                    🤖 AI Assistant
                </a>

                <a href="/settings">
                    ⚙ Settings
                </a>

                <a href="/logout">
                    🚪 Logout
                </a>

            </nav>

        </aside>

        <main class="main-content">

            {% block content %}
            {% endblock %}

        </main>

    </div>

    {% block scripts %}
    {% endblock %}

</body>
</html>
